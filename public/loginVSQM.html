<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSQM | IT Admin Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-image: radial-gradient(circle at center, #ffffff 0%, #e0e6ed 100%); }
        .login-wrapper { text-align: center; }
        .title { color: #1a202c; font-size: 28px; font-weight: 800; letter-spacing: 1px; margin-bottom: 30px; text-transform: uppercase; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; margin: 0 auto; }
        .gauge-icon { font-size: 50px; margin-bottom: 10px; }
        .subtitle { color: #4a5568; margin-bottom: 25px; font-weight: 600; font-size: 15px;}
        .input-group { margin-bottom: 20px; text-align: left; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; background: #f8fafc; }
        input:focus { outline: none; border-color: #4caf50; background: white; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(90deg, #38a169 0%, #d69e2e 100%); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-login:hover { opacity: 0.9; }
        .error-msg { color: #e53e3e; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="title">Secure Access to Judicial Analytics</div>
        <div class="login-card">
            <div class="gauge-icon">📟</div>
            <div class="subtitle">Predictive Stability Indicator</div>
            <div class="input-group"><input type="text" id="username" placeholder="👤 Username (admin)"></div>
            <div class="input-group"><input type="password" id="password" placeholder="🔒 Password (jsc2026)"></div>
            <button class="btn-login" onclick="attemptLogin()">LOGIN TO DASHBOARD</button>
            <div id="errorMsg" class="error-msg">Invalid username or password.</div>
        </div>
    </div>

    <script>
        async function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            const res = await fetch('/api/vsqm/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();

            if (data.success) {
                sessionStorage.setItem('vsqm_auth', data.token);
                window.location.href = '/dashboardVSQM.html';
            } else {
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
