<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IECMS Virtual Court</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-nav"><h2>IECMS Integrated Electronic Case Management System</h2></div>
    <div class="main-container">
        <div class="card">
            <h3>Create Virtual Session</h3>
            <form id="sessionForm">
                <input type="text" id="caseNumber" value="HCHCR38/26" required>
                <button type="submit" class="btn-create">Generate Link</button>
            </form>
            <div id="linkContainer" class="hidden">
                <input type="text" id="generatedLink" readonly>
                <a href="#" id="joinBtn" class="btn-join" target="_blank">Join Session Now</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('sessionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/create-session', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({caseNumber: document.getElementById('caseNumber').value})});
            const data = await res.json();
            document.getElementById('linkContainer').classList.remove('hidden');
            document.getElementById('generatedLink').value = data.link;
            document.getElementById('joinBtn').href = data.link;
        });
    </script>
</body>
</html>
