<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IECMS - Virtual Court Sessions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-nav">
        <h2>IECMS Integrated Electronic Case Management System</h2>
        <a href="/loginVSQM.html" target="_blank" style="background: #111; color: #4caf50; border: 1px solid #4caf50; padding: 8px 12px; text-decoration: none; border-radius: 4px; font-weight: bold;">IT Admin Portal</a>
    </div>

    <div class="main-container">
        <div class="card">
            <h3>Create New Virtual Session</h3>
            <form id="sessionForm">
                <label>Case Number:</label>
                <input type="text" id="caseNumber" value="HCHCR38/26" required>

                <label>Session Date & Time:</label>
                <input type="datetime-local" id="sessionDate" required>

                <button type="submit" class="btn-create">Generate Link</button>
            </form>

            <div id="linkContainer" class="hidden">
                <h4 style="color: #1e7040;">✔ Session Created Successfully!</h4>
                <p>Share this link with the Judge, Lawyers, and Accused:</p>
                <input type="text" id="generatedLink" readonly>
                <button type="button" class="btn-copy" onclick="copyLink()">Copy Link</button>
                <br><br>
                <!-- Changed text to Start Session Now -->
                <a href="#" id="joinBtn" class="btn-join" target="_blank">Start Session Now</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sessionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // --- FIX 2: DATE/TIME VALIDATION ---
            const dateInput = document.getElementById('sessionDate').value;
            const selectedDate = new Date(dateInput);
            const now = new Date();

            if (selectedDate < now) {
                alert("❌ Invalid Date: You cannot schedule a court session for a past date or time.");
                return; // Stops the form from submitting!
            }

            const caseNumber = document.getElementById('caseNumber').value;
            const response = await fetch('/create-session', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caseNumber })
            });
            const data = await response.json();

            document.getElementById('linkContainer').classList.remove('hidden');

            // The link copied for others (NO host privileges)
            document.getElementById('generatedLink').value = data.link;

            // --- FIX 1: HOST BUTTON ---
            // The clerk's button gets a secret &role=Host parameter
            document.getElementById('joinBtn').href = data.link + "&role=Host";
        });

        function copyLink() {
            const linkInput = document.getElementById('generatedLink');
            linkInput.select(); document.execCommand('copy');
            alert("Link copied! (Participants will join as attendees)");
        }
    </script>
</body>
</html>
