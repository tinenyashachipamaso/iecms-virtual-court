<!DOCTYPE html>
<html>
<head>
    <title>Virtual Court Session</title>
    <script src="https://cdn.zegocloud.com/zegouikit/prebuilt/zego-uikit-prebuilt.js"></script>
</head>
<body>
    <div id="root" style="width: 100vw; height: 100vh;"></div>
    <script>
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const appID = 123456789; // REPLACE
            const secret = "your_secret_here"; // REPLACE
            const token = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, secret, params.get('roomID'), Math.random().toString(), "Participant");
            ZegoUIKitPrebuilt.create(token).joinRoom({ container: document.querySelector("#root"), scenario: { mode: ZegoUIKitPrebuilt.GroupCall }});
        });
    </script>
</body>
</html>
