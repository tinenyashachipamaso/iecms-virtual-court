<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Court Session</title>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #222; color: white; font-family: sans-serif; }
        #root { width: 100vw; height: 100vh; }
        #loading { text-align: center; padding-top: 20%; }
    </style>
    <!-- Official Production CDN -->
    <script src="https://cdn.zegocloud.com/zegouikit/prebuilt/zego-uikit-prebuilt.js"></script>
</head>
<body>
    <div id="loading">Loading Virtual Courtroom...</div>
    <div id="root"></div>

    <script>
        window.addEventListener('load', function() {
            // Check if library loaded
            if (typeof ZegoUIKitPrebuilt === 'undefined') {
                document.getElementById('loading').innerHTML = "Error: Library failed to load. Check your network or firewall.";
                return;
            }
            document.getElementById('loading').style.display = 'none';

            const urlParams = new URLSearchParams(window.location.search);
            const roomID = urlParams.get('roomID') || "court_room_default";

            // --- YOUR CREDENTIALS ---
            const appID = 123456789; // Must be a Number
            const serverSecret = "your_32_char_secret_here"; // Must be a String

            const userID = "user_" + Math.floor(Math.random() * 1000000);
            const userName = prompt("Enter your Name for the court record:") || "Participant";

            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);

            const zp = ZegoUIKitPrebuilt.create(kitToken);
            zp.joinRoom({
                container: document.querySelector("#root"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                showScreenSharingButton: true,
                turnOnCameraWhenJoining: false,
                turnOnMicrophoneWhenJoining: false
            });
        });
    </script>
</body>
</html>
