<script>
    // 1. Extract Room ID
    const urlParams = new URLSearchParams(window.location.search);
    const roomID = urlParams.get('roomID');

    if (!roomID) {
        document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:50px;'>Invalid Meeting Link.</h2>";
        throw new Error("No room ID");
    }

    // 2. Configuration - Ensure AppID is a Number, NOT a string
    const appID = 123456789; // REPLACE WITH YOUR ACTUAL NUMBER
    const serverSecret = "your_32_char_secret_here"; // REPLACE WITH YOUR SECRET

    // 3. User Setup
    let userName = prompt("Enter your Name and Role:");
    if (!userName) userName = "Guest_" + Math.floor(Math.random() * 1000);
    const userID = "user_" + Math.floor(Math.random() * 1000000);

    // 4. Debugging - Check if keys are loaded correctly
    console.log("AppID Type:", typeof appID); // Should be 'number'
    console.log("RoomID:", roomID);

    // 5. Generate Token
    const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
        appID,
        serverSecret,
        roomID,
        userID,
        userName
    );

    // 6. Initialize
    const zp = ZegoUIKitPrebuilt.create(kitToken);
    zp.joinRoom({
        container: document.querySelector("#root"),
        scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
        showScreenSharingButton: true,
        turnOnCameraWhenJoining: false,
        turnOnMicrophoneWhenJoining: false,
    });
</script>
