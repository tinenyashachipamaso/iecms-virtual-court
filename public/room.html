<!DOCTYPE html>
<html>
<head>
    <title>Virtual Court Session</title>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #222; }
        #root { width: 100vw; height: 100vh; }
    </style>
    <!-- Load the library in the head -->
    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
</head>
<body>
    <div id="root"></div>

    <script>
        window.onload = function() {
            // 1. Check if library loaded
            if (typeof ZegoUIKitPrebuilt === 'undefined') {
                document.body.innerHTML = "<h2 style='color:white; text-align:center;'>Error: Zego library failed to load. Check internet connection.</h2>";
                return;
            }

            // 2. Extract Room ID
            const urlParams = new URLSearchParams(window.location.search);
            const roomID = urlParams.get('roomID') || "default_court_room";

            // 3. Configuration (REPLACE THESE)
            const appID = 123456789; // Must be a number
            const serverSecret = "your_32_char_secret_here"; // Must be a string

            const userID = "user_" + Math.floor(Math.random() * 1000000);
            const userName = prompt("Enter your Name and Role:") || "Participant";

            // 4. Generate Token
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);

            // 5. Initialize
            const zp = ZegoUIKitPrebuilt.create(kitToken);
            zp.joinRoom({
                container: document.querySelector("#root"),
                sharedLinks: [{ name: 'Invite Link', url: window.location.href }],
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
            });
        };
    </script>
</body>
</html>
