<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Court Session</title>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #222; }
        #root { width: 100vw; height: 100vh; }
    </style>
    <!-- Point to your local server libs -->
    <script src="/libs/zego-uikit-prebuilt.js"></script>
</head>
<body>
    <div id="root"></div>

    <script>
        window.addEventListener('load', function() {
            if (typeof ZegoUIKitPrebuilt === 'undefined') {
                document.body.innerHTML = "<h2 style='color:white; text-align:center;'>System Error: Local library failed to load. Check server logs.</h2>";
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const roomID = urlParams.get('roomID') || "default_room";

            const appID = 123456789; // REPLACE WITH YOUR NUMBER
            const serverSecret = "your_32_char_secret"; // REPLACE WITH YOUR SECRET

            const userID = "user_" + Math.floor(Math.random() * 1000000);
            const userName = prompt("Enter your Name for the record:") || "Participant";

            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);

            const zp = ZegoUIKitPrebuilt.create(kitToken);
            zp.joinRoom({
                container: document.querySelector("#root"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                turnOnCameraWhenJoining: false,
                turnOnMicrophoneWhenJoining: false,
            });
        });
    </script>
</body>
</html>
