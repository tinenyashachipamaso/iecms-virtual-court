<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <title>VSQM Dashboard | Judicial Systems</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-200">

  <div class="bg-emerald-900/40 border-b border-emerald-500/30 px-6 py-2.5 flex justify-between">
    <h1 class="font-bold text-emerald-100">Judicial Systems Portal &mdash; VSQM</h1>
    <span id="clockDisplay" class="font-mono text-emerald-400"></span>
  </div>

  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <aside class="w-full md:w-56 bg-slate-900/90 border-r border-slate-800 p-4 shrink-0 space-y-2">
      <button onclick="switchTab('scheduling')" class="nav-btn w-full text-left px-3 py-2 rounded bg-slate-800 border border-slate-700 text-sm">📝 Schedule Roll</button>
      <button onclick="switchTab('sessions')" class="nav-btn w-full text-left px-3 py-2 rounded bg-slate-800 border border-slate-700 text-sm">📅 Sessions</button>
      <button onclick="switchTab('vsqm')" class="nav-btn w-full text-left px-3 py-2 rounded bg-emerald-600 border border-emerald-500 text-sm font-bold text-white">📊 VSQM Analytics</button>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto">

      <!-- SCHEDULING -->
      <div id="tab-scheduling" class="tab-pane" style="display: none;">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
          <h2 class="text-emerald-400 font-bold mb-4">Schedule New Case</h2>
          <form id="schedForm" class="grid grid-cols-2 gap-4">
            <div><label class="text-xs">Case Number</label><input type="text" id="cNum" class="w-full bg-slate-950 border border-slate-700 p-2 rounded" required></div>
            <div><label class="text-xs">Judge</label><input type="text" id="cJudge" class="w-full bg-slate-950 border border-slate-700 p-2 rounded" required></div>
            <div><label class="text-xs">Court</label><input type="text" id="cCourt" class="w-full bg-slate-950 border border-slate-700 p-2 rounded" required></div>
            <div>
              <label class="text-xs">Slot</label>
              <select id="cSlot" class="w-full bg-slate-950 border border-slate-700 p-2 rounded">
                <option>Morning (9am-11am)</option><option>Mid-Morning (11am-1pm)</option><option>Afternoon (2pm+)</option>
              </select>
            </div>
            <div><label class="text-xs">Date</label><input type="date" id="cDate" class="w-full bg-slate-950 border border-slate-700 p-2 rounded" required></div>
            <div><label class="text-xs">Exact Start Time (24HR)</label><input type="time" id="cTime" class="w-full bg-slate-950 border border-slate-700 p-2 rounded" required></div>

            <!-- MULTIPLE PARTIES LOGIC -->
            <div class="col-span-2 bg-slate-950 p-4 rounded border border-slate-700 mt-2">
                <label class="text-xs font-bold text-emerald-400">Add Parties (Required)</label>
                <div class="flex gap-2 mt-2">
                    <input type="text" id="pName" placeholder="Participant Name" class="flex-1 bg-slate-900 border border-slate-700 p-2 rounded">
                    <select id="pRole" class="bg-slate-900 border border-slate-700 p-2 rounded">
                        <option>Defendant</option><option>Applicant</option><option>Accused</option><option>State Counsel</option><option>Defense Counsel</option>
                    </select>
                    <button type="button" onclick="addParty()" class="bg-sky-600 px-4 py-2 rounded text-white font-bold">Add</button>
                </div>
                <ul id="partiesList" class="mt-3 space-y-1 text-sm text-slate-300"></ul>
            </div>

            <button type="submit" class="col-span-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded mt-2">Submit to Court Roll</button>
          </form>
        </div>
      </div>

      <!-- SESSIONS (5-MIN LOCK) -->
      <div id="tab-sessions" class="tab-pane" style="display: none;">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
          <h2 class="text-emerald-400 font-bold mb-4">Scheduled Sessions (5-Min Real-Time Lock)</h2>
          <table class="w-full text-left text-sm"><tbody id="sessionsList" class="divide-y divide-slate-800"></tbody></table>
        </div>
      </div>

      <!-- VSQM ANALYTICS (REAL NAMES ONLY) -->
      <div id="tab-vsqm" class="tab-pane">
        <div class="grid grid-cols-3 gap-6">
          <div class="col-span-1 bg-slate-900 p-4 border border-slate-800 rounded-xl">
            <h2 class="text-xs font-bold uppercase text-slate-200 mb-3 border-b border-slate-800 pb-2">Active Rooms (Live Users)</h2>
            <div id="vsqmActiveList"></div>
          </div>
          <div class="col-span-2 bg-slate-900 p-4 border border-slate-800 rounded-xl">
            <h2 class="text-xs font-bold uppercase text-slate-200 mb-3 flex justify-between"> Participant Telemetry <span id="selectedCaseLabel" class="text-emerald-400">No Room</span></h2>
            <table class="w-full text-left text-xs"><tbody id="vsqmTelemetryBody" class="font-mono"></tbody></table>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-6 mt-6">
            <div class="col-span-2 bg-slate-900 p-4 border border-slate-800 rounded-xl">
                <h2 class="text-xs font-bold uppercase text-slate-200 mb-3">Session Diagnostics</h2>
                <div id="diagnosticTerminal" class="font-mono text-xs text-slate-300 h-32 overflow-y-auto"></div>
            </div>
            <div class="col-span-1 bg-slate-900 p-4 border border-slate-800 rounded-xl text-center">
                <h2 class="text-xs font-bold uppercase text-slate-200 mb-3">Health Score</h2>
                <h1 id="healthScore" class="text-5xl font-bold text-emerald-400 mt-4">--%</h1>
            </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // CLOCK & TIME LOGIC
    setInterval(() => {
        document.getElementById('clockDisplay').innerText = new Date().toLocaleTimeString();
        if (document.getElementById('tab-sessions').style.display === 'block') renderSessions();
    }, 1000);

    function switchTab(tabId) {
        document.querySelectorAll('.tab-pane').forEach(t => t.style.display = 'none');
        document.getElementById('tab-' + tabId).style.display = 'block';
        if (tabId === 'sessions') fetchSessions();
    }

    // MULTIPLE PARTIES LOGIC
    let currentParties = [];
    function addParty() {
        const name = document.getElementById('pName').value;
        const role = document.getElementById('pRole').value;
        if (!name) return alert("Enter a name!");
        currentParties.push({ name, role });
        document.getElementById('pName').value = '';
        renderParties();
    }
    function renderParties() {
        document.getElementById('partiesList').innerHTML = currentParties.map(p => `<li>• ${p.name} (${p.role})</li>`).join('');
    }

    // SCHEDULING LOGIC
    document.getElementById('schedForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (currentParties.length === 0) return alert("You must add at least one party!");

        const data = {
            caseNumber: document.getElementById('cNum').value, judge: document.getElementById('cJudge').value,
            court: document.getElementById('cCourt').value, parties: currentParties,
            date: document.getElementById('cDate').value, time: document.getElementById('cTime').value, slot: document.getElementById('cSlot').value
        };
        const res = await fetch('/api/vsqm/schedule', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) {
            alert("Court Roll Updated Successfully!");
            document.getElementById('schedForm').reset();
            currentParties = []; renderParties();
        } else { alert(result.message); } // 15 LIMIT ALERT
    });

    // 5-MINUTE LOCK LOGIC
    let globalSessions = [];
    async function fetchSessions() {
        const res = await fetch('/api/vsqm/sessions');
        globalSessions = await res.json();
        renderSessions();
    }
    function renderSessions() {
        const tbody = document.getElementById('sessionsList');
        tbody.innerHTML = '<tr class="bg-slate-950 text-slate-400"><th>Case</th><th>Date</th><th>Time</th><th>Parties</th><th>Action</th></tr>';

        globalSessions.forEach(s => {
            // Real-Time 5-minute math
            const sessionTime = new Date(`${s.date}T${s.time}`);
            const now = new Date();
            const diffMinutes = (sessionTime - now) / 60000;

            let actionBtn = '';
            if (diffMinutes <= 5) {
                // If 5 mins before, or time has passed, show launch!
                actionBtn = `<a href="${s.joinLink}" target="_blank" class="bg-emerald-600 px-3 py-1 rounded text-white font-bold">Start Session</a>`;
            } else {
                // Too early
                actionBtn = `<span class="text-amber-500 font-mono text-xs">Unlocks in ${Math.ceil(diffMinutes - 5)}m</span>`;
            }

            const partiesStr = s.parties.map(p => `${p.name}(${p.role})`).join(', ');

            tbody.innerHTML += `<tr><td class="p-2">${s.caseNumber}</td><td class="p-2">${s.date}</td><td class="p-2">${s.time}</td><td class="p-2 text-xs">${partiesStr}</td><td class="p-2">${actionBtn}</td></tr>`;
        });
    }

    // VSQM REAL DATA LOGIC
    let liveDatabase = {};
    let selectedRoomId = null;

    async function fetchVSQMData() {
        const res = await fetch('/api/vsqm/livedata');
        liveDatabase = await res.json();

        const list = document.getElementById('vsqmActiveList');
        list.innerHTML = '';
        const rooms = Object.keys(liveDatabase);

        if (rooms.length === 0) { list.innerHTML = "<p class='text-slate-500'>Waiting for users to join...</p>"; return; }

        rooms.forEach(id => {
            const btn = document.createElement('button');
            btn.onclick = () => { selectedRoomId = id; updateVSQMUI(); };
            btn.className = `w-full text-left p-2 border mb-2 text-xs font-mono rounded ${id === selectedRoomId ? 'bg-emerald-800' : 'bg-slate-800'}`;
            btn.innerText = liveDatabase[id].title;
            list.appendChild(btn);
        });
        if (selectedRoomId && liveDatabase[selectedRoomId]) updateVSQMUI();
    }

    function updateVSQMUI() {
        const room = liveDatabase[selectedRoomId];
        document.getElementById('selectedCaseLabel').innerText = room.title;
        document.getElementById('healthScore').innerText = room.stabilityScore + '%';

        const tbody = document.getElementById('vsqmTelemetryBody');
        tbody.innerHTML = '<tr class="bg-slate-950 text-slate-400"><th>Real Name</th><th>Bandwidth</th><th>Jitter</th><th>Latency</th><th>Loss</th></tr>';
        room.participants.forEach(p => {
            const color = p.status === 'Warning' ? 'text-red-400 font-bold' : 'text-slate-300';
            tbody.innerHTML += `<tr><td class="p-2">${p.name}</td><td class="p-2 ${color}">${p.bandwidth}Mbps</td><td class="p-2 ${color}">${p.jitter}ms</td><td class="p-2 ${color}">${p.latency}ms</td><td class="p-2 ${color}">${p.loss}%</td></tr>`;
        });

        const term = document.getElementById('diagnosticTerminal');
        term.innerHTML = '';
        room.diagnostics.forEach(log => { term.innerHTML += `<div><span class="text-red-400">${log.time}</span> - ${log.text}</div>`; });
        if (room.diagnostics.length === 0) term.innerHTML = '<div class="text-emerald-400">All connections stable.</div>';
    }

    setInterval(fetchVSQMData, 2000);
    switchTab('vsqm'); // Default load
  </script>
</body>
</html>
