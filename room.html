<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Court Session</title>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #222; color: white; }
        #root { width: 100vw; height: 100vh; }
    </style>
    <!-- Relative path: Looks in the same folder -->
    <script src="zego-uikit-prebuilt.js"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        window.addEventListener('load', function() {
            if (typeof ZegoUIKitPrebuilt === 'undefined') {
                document.body.innerHTML = "<h2 style='text-align:center;'>Error: zego-uikit-prebuilt.js not found in root.</h2>";
                return;
            }
            const urlParams = new URLSearchParams(window.location.search);
            const roomID = urlParams.get('roomID') || "court_room";

            const appID = 123456789; // REPLACE
            const serverSecret = "your_32_char_secret"; // REPLACE

            const userID = "user_" + Math.floor(Math.random() * 1000000);
            const userName = prompt("Enter Name:") || "Participant";

            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);
            const zp = ZegoUIKitPrebuilt.create(kitToken);

            zp.joinRoom({
                container: document.querySelector("#root"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall }
            });
        });
    </script>
</body>
</html>
